name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "BrownDust2_MOD_Manager_Advanced.py"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Check Python syntax
        run: python -m py_compile BrownDust2_MOD_Manager_Advanced.py

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BrownDust2_MOD_Manager_Advanced BrownDust2_MOD_Manager_Advanced.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrownDust2-MOD-Manager-Windows
          path: dist/BrownDust2_MOD_Manager_Advanced.exe
          if-no-files-found: error
